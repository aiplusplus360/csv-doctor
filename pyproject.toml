[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-doctor"
version = "1.0.0"
description = "Profile, validate and repair messy CSV files. Types, outliers, ragged rows, and a plan before any rewrite."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aiplusplus360" }]
keywords = ["csv", "data-quality", "profiling", "etl", "validation", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
csv-doctor = "csvdoctor.cli:main"

[project.urls]
Homepage = "https://github.com/aiplusplus360/csv-doctor"
Source = "https://github.com/aiplusplus360/csv-doctor"
Issues = "https://github.com/aiplusplus360/csv-doctor/issues"

[tool.setuptools]
packages = ["csvdoctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
